# Refresh the shared company + job data in Neon. Runs on GitHub's free machines, not on Render's
# small free server and not on anyone's laptop. Weekly, or press "Run workflow" on the Actions tab.
# Needs repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL    the same Neon URL Render uses        (required)
#   GEMINI_API_KEY  for Tier 3 (LLM) careers pages      (optional: without it those pages are skipped)
name: Refresh data

on:
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "How many companies to discover and crawl (best quality_score first)"
        default: "300"

concurrency:  # never two refreshes at once
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # a hard stop, so a stuck crawl can't eat the free minutes
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SORT_SHERR_EMBEDDER: fastembed  # the same embeddings the website reads
      LIMIT: ${{ github.event.inputs.limit || '300' }}
    steps:
      - name: Check settings
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Add the DATABASE_URL secret first (Neon)."; exit 1; fi
          if ! [[ "$LIMIT" =~ ^[0-9]{1,5}$ ]]; then echo "limit must be a number"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[refresh]"
          python -m playwright install --with-deps chromium
      - name: Seed companies (YC + this month's HN thread)
        run: |
          python -m sort_sherr.cli seed --source yc
          python -m sort_sherr.cli seed --source hn
      - name: Discover careers pages (the next best companies not yet checked)
        run: python -m sort_sherr.cli discover --limit "$LIMIT"
      - name: Crawl jobs
        run: python -m sort_sherr.cli crawl --limit "$LIMIT"
      - name: Embed companies (so a student's match only embeds their resume)
        run: python -m sort_sherr.cli embed-companies
      - name: Summary
        run: python -m sort_sherr.cli stats
