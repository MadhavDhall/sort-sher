{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1 style="margin-top:0">Log in</h1>
  <p class="muted small">Sort Sherr is invite-only. No account? Ask whoever runs this site for an invite link.</p>
  {% if error %}<p class="notice bad-notice">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span>Username</span><input type="text" name="username" required autocomplete="username" autofocus maxlength="30"></label>
    <label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password" maxlength="200"></label>
    <button type="submit">Log in</button>
  </form>
  <p class="small muted" style="margin-bottom:0">Forgot your password? Ask the admin for a reset link.</p>
</div>
{% endblock %}
