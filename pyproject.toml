[project]
name = "sort-sherr"
version = "0.1.0"
description = "Find good off-campus internships at startups (ingestion module)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "google-genai>=1.0",
    # web app
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
sort-sherr = "sort_sherr.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sort_sherr*"]

[tool.setuptools.package-data]
"sort_sherr.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
