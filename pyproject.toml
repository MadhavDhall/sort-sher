[project]
name = "sort-sherr"
version = "0.1.0"
description = "Find good off-campus internships at startups (ingestion module)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "google-genai>=1.0",
    # web app
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Part 3: MX record check for contact emails (DNS only, never SMTP)
    "dnspython>=2.6",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
# Part 2: resume parsing + matching (sentence-transformers pulls in torch, ~1 GB)
match = ["pypdf>=5", "python-docx>=1.1", "numpy>=1.26", "sentence-transformers>=3"]
dev = ["pytest>=8"]
# Hosting (Render free + Neon): Postgres driver, the login cookie, and matching WITHOUT torch
# (fastembed runs the same bge-small model with ONNX, ~280 MB instead of ~1 GB).
deploy = ["psycopg[binary]>=3.2", "itsdangerous>=2.1", "fastembed>=0.4", "pypdf>=5", "python-docx>=1.1", "numpy>=1.26"]
# GitHub Actions refresh: the crawl (with a real browser for JavaScript pages) + embeddings
refresh = ["psycopg[binary]>=3.2", "fastembed>=0.4", "numpy>=1.26", "playwright>=1.45"]

[project.scripts]
sort-sherr = "sort_sherr.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sort_sherr*"]

[tool.setuptools.package-data]
"sort_sherr.web" = ["templates/*.html", "static/*"]
"sort_sherr.outreach" = ["prompts/*"]
"sort_sherr.tracker" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
